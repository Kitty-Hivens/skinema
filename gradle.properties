org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true
kotlin.code.style=official

# skinema-natives ships on its own version line: the FFmpeg build its bundles
# carry, plus a revision for repacks of that same build (ROADMAP M17). Bump the
# revision whenever the assets on the rolling release change -- published Maven
# versions are immutable, so changed bytes need a new number.
nativesVersion=8.1.1-1
