[versions]
kotlin       = "2.4.10"
compose      = "1.12.0"
skiko        = "0.144.6"
# Maven Central publishing (signing + Central Portal upload) -- the
# libtray-proven recipe.
mavenPublish = "0.37.0"
# Coverage. Not a score to chase -- the question it answers is which code no
# test has ever executed, which is how a whole GPU path stayed dead for two
# months behind a green suite.
kover        = "0.9.9"

[libraries]
compose-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "compose" }
compose-runtime    = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "compose" }
kotlin-test        = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
skiko-awt          = { group = "org.jetbrains.skiko", name = "skiko-awt", version.ref = "skiko" }

[plugins]
kotlin-jvm              = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose                 = { id = "org.jetbrains.compose", version.ref = "compose" }
maven-publish           = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
kover                   = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
