[versions]
kotlin       = "2.4.21"
compose      = "1.12.2"
# Moves with `compose`, never on its own: skiko is compileOnly here, so the
# copy that runs is whatever the consumer's Compose brings, and 0.150.2 is
# what 1.12.2 brings. Bumping one alone puts one version's API on the
# classpath beside the other's native runtime.
skiko        = "0.150.2"
# Maven Central publishing (signing + Central Portal upload) -- the
# libtray-proven recipe.
mavenPublish = "0.37.0"
# Coverage. Not a score to chase -- the question it answers is which code no
# test has ever executed, which is how a whole GPU path stayed dead for two
# months behind a green suite.
kover        = "0.9.11"
# The Android target (ROADMAP M23). AGP and Media3 match the primary consumer.
agp          = "9.5.0"
media3       = "1.11.1"
androidx-test-runner = "1.7.0"
androidx-test-junit  = "1.3.0"
activity-compose     = "1.13.0"

[libraries]
compose-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "compose" }
compose-runtime    = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "compose" }
kotlin-test        = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
skiko-awt          = { group = "org.jetbrains.skiko", name = "skiko-awt", version.ref = "skiko" }
media3-exoplayer   = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidx-test-runner" }
androidx-test-junit  = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-junit" }
kotlin-test-junit    = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlin" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }

[plugins]
kotlin-jvm              = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform    = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose                 = { id = "org.jetbrains.compose", version.ref = "compose" }
maven-publish           = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
kover                   = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
android-kmp-library     = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-application     = { id = "com.android.application", version.ref = "agp" }
