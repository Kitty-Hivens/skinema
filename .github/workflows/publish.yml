name: Publish

# Publishing is deliberate, never a side effect of a push. Libraries go out
# when a vX.Y.Z tag lands; the natives only on an explicit dispatch, and only
# when their bundles actually changed -- republishing the ~211 MiB of unchanged
# platform jars with every release is what put dev.hivens over Maven Central's
# size cap (ROADMAP M17). Both jobs run in the maven-central environment, so
# the credentials stay behind whatever approval that environment requires.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "What to publish"
        type: choice
        options: [libraries, natives]
        default: libraries
      version:
        description: "Library version for a dispatched libraries run (a tag run reads its own tag)"
        default: ""

# Serialised on purpose. Two runs of this would each pass the guard --
# repo1 lags the portal by tens of minutes, so the already-published
# check cannot see the other run -- and both would upload, against a
# monthly size cap this account is already at.
concurrency:
  group: publish-${{ github.event.inputs.target || 'libraries' }}
  cancel-in-progress: false

jobs:
  libraries:
    if: github.event_name == 'push' || inputs.target == 'libraries'
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # Nothing else on this path proves the code works. A tag can be pushed to
      # a commit the Build workflow never saw, or one where it was red, and the
      # publication is signed and auto-released -- to a coordinate that can
      # never be reissued. Run the suite here rather than trusting that someone
      # looked, and run it before the signing key enters the job.
      #
      # With a bundle, because without one this proved almost nothing: a bare
      # runner has no libav, so 313 of 487 tests skipped and what ran was the
      # pure-Kotlin subset. The gate then failed on its own skip ceiling rather
      # than on anything about the code, which is how it took a release down
      # while looking like a test failure. Given the natives the release pairs
      # with, the suite here is the same suite the Build matrix runs.
      - name: Install the ffmpeg CLI the fixtures shell out to
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libass9 libva2 libfontconfig1

      - name: Take the natives this release pairs with
        shell: bash
        run: |
          nv=$(sed -n 's/^nativesVersion=//p' gradle.properties)
          tag="natives-${nv%%-*}"
          mkdir -p libav-bundle
          curl -fsSL -o bundle.tar.gz \
            "https://github.com/${{ github.repository }}/releases/download/$tag/skinema-natives-decode-linux-x64.tar.gz"
          tar -xzf bundle.tar.gz -C libav-bundle
          echo "SKINEMA_LIBAV_DIR=$PWD/libav-bundle" >> "$GITHUB_ENV"

      - name: Build and test before publishing anything
        env:
          # What the decode tier must load, and the ceiling its linux row
          # measures -- the same pair the Build matrix holds that row to.
          SKINEMA_REQUIRE_CAPS: "decode,webp,subs,formats,encav1,encopus,cea608"
          SKINEMA_MAX_SKIPPED: "60"
        run: ./gradlew build

      - name: Resolve the version
        id: version
        shell: bash
        env:
          # Through the environment, never interpolated into the script: an
          # expression is substituted while the script is still text, so the
          # checks below would run on a body the input had already rewritten.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="${INPUT_VERSION#v}"
          fi
          # A dispatched run is where "v0.7.0" gets pasted in by hand; the tag
          # path already stripped the v. Either way the version starts with a
          # digit, and a leading v would publish coordinates nobody can consume.
          case "$v" in
            "") echo "::error::no version -- a dispatched run must pass one"; exit 1 ;;
            [0-9]*) ;;
            *) echo "::error::version '$v' does not start with a digit"; exit 1 ;;
          esac
          case "$v" in
            *[!0-9A-Za-z.-]*) echo "::error::version '$v' has characters a version does not"; exit 1 ;;
          esac
          echo "v=$v" >> "$GITHUB_OUTPUT"

      # Central versions are immutable and the natives publish on their own
      # line, so both halves of the push-sequencing rule are checkable before
      # anything is signed: this version must be free, and the natives the
      # release pairs with must already be up.
      - name: Guard the release coordinates
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.v }}
        run: |
          base=https://repo1.maven.org/maven2/dev/hivens
          v="$VERSION"
          nv=$(sed -n 's/^nativesVersion=//p' gradle.properties)

          if curl -fsI -o /dev/null "$base/skinema-core/$v/skinema-core-$v.pom"; then
            echo "::error::dev.hivens:skinema-core:$v is already on Central -- versions are immutable"
            exit 1
          fi
          if ! curl -fsI -o /dev/null "$base/skinema-natives/$nv/skinema-natives-$nv.pom"; then
            echo "::error::skinema-natives $nv is not on Central yet -- publish the natives first"
            exit 1
          fi
          echo "publishing $v against natives $nv"

      - name: Publish core, skiko and compose
        shell: bash
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.v }}
        run: |
          # publishLibraries, never the bare publishToMavenCentral: that one
          # sweeps the natives in with the libraries.
          ./gradlew publishLibraries \
            -PappVersion="$VERSION" \
            --no-configuration-cache

  natives:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'natives'
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # The publication packs its 24 jars straight from the rolling release, so
      # a missing asset would ship a short release under a version that can
      # never be reissued. Every asset's upload time goes into the log with it:
      # that is the record of which build these bytes actually are.
      - name: Guard the bundles on the rolling release
        id: bundles
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nv=$(sed -n 's/^nativesVersion=//p' gradle.properties)
          ffver="${nv%%-*}"
          tag="natives-$ffver"
          echo "nv=$nv" >> "$GITHUB_OUTPUT"

          # The tier -> features mapping has one home, in the build script.
          # Lifted rather than restated, because a second copy is how the two
          # drift and this guard starts approving the wrong bundles.
          eval "$(sed -n '/^tier_features()/,/^}/p' tools/build-natives.sh)"

          if curl -fsI -o /dev/null \
            "https://repo1.maven.org/maven2/dev/hivens/skinema-natives/$nv/skinema-natives-$nv.pom"; then
            echo "::error::skinema-natives $nv is already on Central -- bump the revision in gradle.properties"
            exit 1
          fi

          assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
            --jq '.assets[] | "\(.name) \(.updated_at)"')
          missing=0
          for tier in core decode full; do
            # Must match skinema-natives/build.gradle.kts. A platform missing
            # here passes the guard, passes the immutability check, and fails
            # inside the publish -- after the environment approval, with the
            # signing key already in the job.
            for platform in linux-x64 linux-arm64 linux-musl-x64 linux-musl-arm64 windows-x64 windows-arm64 macos-arm64 macos-x64; do
              name="skinema-natives-$tier-$platform.tar.gz"
              line=$(printf '%s\n' "$assets" | grep "^$name " || true)
              if [ -z "$line" ]; then
                echo "::error::$tag is missing $name"
                missing=1
                continue
              fi
              echo "$line"

              # Presence is not enough. The tag rolls -- a targeted rebuild
              # replaces one asset and leaves the rest -- so all 24 can be
              # there while some came from a different FFmpeg line or a
              # different feature set. Read each bundle's own manifest instead
              # of trusting the file name, because these bytes become 24
              # immutable jars.
              curl -fsSL -o /tmp/b.tar.gz \
                "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$name" || {
                  echo "::error::$name is listed on $tag but could not be downloaded"; missing=1; continue; }
              man=$(tar -xzOf /tmp/b.tar.gz ./manifest.txt 2>/dev/null || true)
              [ -n "$man" ] || { echo "::error::$name carries no manifest.txt"; missing=1; continue; }

              got_ff=$(printf '%s\n' "$man" | sed -n 's/^ffmpeg //p')
              got_ft=$(printf '%s\n' "$man" | sed -n 's/^features //p')
              if [ "$got_ff" != "$ffver" ]; then
                echo "::error::$name was built from FFmpeg $got_ff, but nativesVersion says $ffver"
                missing=1
              fi
              want_ft="$(tier_features "$tier")"
              if [ "$(printf '%s' "$got_ft" | tr -s ' ' | sed 's/ *$//')" != "$want_ft" ]; then
                echo "::error::$name carries features '$got_ft', expected '$want_ft'"
                missing=1
              fi
              echo "    ffmpeg $got_ff | $(tar -xzOf /tmp/b.tar.gz ./index.txt 2>/dev/null | head -1)"
              rm -f /tmp/b.tar.gz
            done
          done
          [ "$missing" = 0 ]

      - name: Publish the natives
        shell: bash
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          NATIVES_VERSION: ${{ steps.bundles.outputs.nv }}
        run: |
          echo "publishing skinema-natives $NATIVES_VERSION (~211 MiB against the monthly cap)"
          ./gradlew :skinema-natives:publishToMavenCentral --no-configuration-cache
