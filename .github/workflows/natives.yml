name: Natives

# Builds the trimmed shipping runtimes (ROADMAP.md section 4) for every
# supported platform across the modular tiers (core/decode/full), runs the
# tier's acceptance suite against the fresh binaries, and uploads each
# tier x platform INDEPENDENTLY to the rolling `natives-<ffmpeg version>`
# release: a queued or failed build never blocks the others, late builds
# land hot on the same tag, and a rebuild replaces its own asset. Manual
# trigger: these are release artifacts, not per-commit noise.

on:
  workflow_dispatch:
    inputs:
      only_platform:
        description: "Build only this platform (blank = all), e.g. windows-arm64"
        default: ""
      only_tier:
        description: "Build only this tier: core | decode | full (blank = all)"
        default: ""

permissions:
  contents: write

env:
  FFMPEG_VERSION: "8.1.1"

jobs:
  # The tier x platform matrix is generated here so a dispatch can narrow it to
  # one platform and/or tier -- targeted rebuilds, and cheap iteration on a new
  # platform without rebuilding (and re-uploading) the ones that already ship.
  # Unfiltered it is every tier on every platform; each entry carries the
  # platform's runner os and, for the cross builds, the cross id.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        shell: bash
        env:
          ONLY_PLATFORM: ${{ inputs.only_platform }}
          ONLY_TIER: ${{ inputs.only_tier }}
        run: |
          # core drops the multi-MB libass stack, decode adds it, full adds GPL
          # encode. GitHub's free arm64 runners (linux-arm64, windows-arm64) are
          # real machines and get the on-runner acceptance run; macos-x64 cross-
          # compiles on the arm mac (Intel runners are scarce) -- community tier,
          # no acceptance, an arm JVM cannot load x86_64 dylibs.
          declare -A OS=( [linux-x64]=ubuntu-latest [linux-arm64]=ubuntu-24.04-arm [windows-x64]=windows-latest [windows-arm64]=windows-11-arm [macos-arm64]=macos-14 [macos-x64]=macos-14 )
          declare -A CROSS=( [macos-x64]=mac-x64 )
          items=()
          for t in core decode full; do
            [ -n "$ONLY_TIER" ] && [ "$ONLY_TIER" != "$t" ] && continue
            for p in linux-x64 linux-arm64 windows-x64 windows-arm64 macos-arm64 macos-x64; do
              [ -n "$ONLY_PLATFORM" ] && [ "$ONLY_PLATFORM" != "$p" ] && continue
              items+=("{\"tier\":\"$t\",\"platform\":\"$p\",\"os\":\"${OS[$p]}\",\"cross\":\"${CROSS[$p]:-}\"}")
            done
          done
          echo "matrix={\"include\":[$(IFS=,; echo "${items[*]}")]}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # FEATURES and the acceptance caps for this tier. The full tier ships
      # H.264 (x264) and HEVC (x265) software encode on every platform; the
      # x265 source is patched so cmake 4.x configures it on macOS/Windows
      # (#22). decode and full also carry enc-vaapi -- the LGPL hardware
      # H.264/HEVC encoders on Linux (M13); it is a no-op on the other
      # platforms and has no GPU on the runners, so it adds no encode cap.
      - name: Resolve tier
        id: tier
        shell: bash
        run: |
          case "${{ matrix.tier }}" in
            core)   feat="av1 vpx webp hwaccel";                                          caps="decode,webp" ;;
            decode) feat="av1 vpx webp hwaccel subs formats enc-vaapi";                   caps="decode,webp,subs,formats" ;;
            full)   feat="av1 vpx webp hwaccel subs formats enc-vaapi enc-h264 enc-hevc"; caps="decode,webp,subs,formats,encode" ;;
          esac
          echo "features=$feat" >> "$GITHUB_OUTPUT"
          echo "caps=$caps" >> "$GITHUB_OUTPUT"

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        # libfontconfig-dev: libass's Linux font provider builds against the
        # system fontconfig (and links it dynamically -- every desktop ships
        # it). libva-dev: the VAAPI hwaccel builds against libva and links it
        # dynamically, the same pattern -- pulled in for the build and for
        # the on-runner acceptance test (libva-dev depends on libva2).
        run: sudo apt-get update && sudo apt-get install -y nasm cmake meson ninja-build pkg-config libfontconfig-dev libva-dev

      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm cmake meson ninja pkg-config

      - name: Install toolchain (Windows x64 / MSYS2 MINGW64)
        if: matrix.platform == 'windows-x64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            curl
            unzip

      # CLANGARM64: aarch64 clang + libc++. No nasm -- it is an x86 assembler;
      # dav1d/x265/libvpx assemble NEON through the C compiler/gas on arm64.
      - name: Install toolchain (Windows arm64 / MSYS2 CLANGARM64)
        if: matrix.platform == 'windows-arm64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: false
          # autoconf/automake/libtool: the libass autotools stack is
          # regenerated with the system libtool here (the tarballs' own cannot
          # build aarch64-mingw DLLs); base-devel does not pull them on arm64.
          install: >-
            base-devel
            autoconf
            automake
            libtool
            mingw-w64-clang-aarch64-toolchain
            mingw-w64-clang-aarch64-cmake
            mingw-w64-clang-aarch64-meson
            mingw-w64-clang-aarch64-ninja
            mingw-w64-clang-aarch64-pkgconf
            curl
            unzip

      - name: Build trimmed FFmpeg (unix)
        if: runner.os != 'Windows'
        env:
          FEATURES: ${{ steps.tier.outputs.features }}
        run: |
          if [ "${{ matrix.cross }}" = "mac-x64" ]; then export MAC_CROSS_X64=1; fi
          STATIC_DEPS=1 FFMPEG_VERSION="$FFMPEG_VERSION" tools/build-natives.sh "$PWD/natives/${{ matrix.platform }}"

      - name: Build trimmed FFmpeg (Windows x64)
        if: matrix.platform == 'windows-x64'
        shell: msys2 {0}
        env:
          FEATURES: ${{ steps.tier.outputs.features }}
        run: STATIC_DEPS=1 FFMPEG_VERSION="$FFMPEG_VERSION" VPX_TARGET=x86_64-win64-gcc tools/build-natives.sh "$PWD/natives/${{ matrix.platform }}"

      # No VPX_TARGET forced: there is no fixed arm64-win64 gcc triplet like
      # x64's, so libvpx detects the aarch64 mingw target itself.
      - name: Build trimmed FFmpeg (Windows arm64)
        if: matrix.platform == 'windows-arm64'
        shell: msys2 {0}
        env:
          FEATURES: ${{ steps.tier.outputs.features }}
        run: STATIC_DEPS=1 FFMPEG_VERSION="$FFMPEG_VERSION" tools/build-natives.sh "$PWD/natives/${{ matrix.platform }}"

      # Static proof the Windows bundle both carries and MAPS what it imports
      # (liblzma-5 and libc++ each slipped through once, because nothing
      # checked the two halves). Neither is a load test: the acceptance run
      # below can be fooled by a runtime DLL leaking onto the runner PATH that
      # a clean user machine lacks -- reading the import tables cannot. The
      # script lives in tools/ so it can be run against any bundle off a
      # Windows host too.
      - name: Verify the Windows bundle is import-closed and preload-complete
        if: startsWith(matrix.platform, 'windows')
        shell: msys2 {0}
        run: tools/check-windows-bundle.sh "natives/${{ matrix.platform }}/bundle" "$PWD"

      # The acceptance gate: the suite must pass against the binaries we are
      # about to ship, on the platform that will run them. Cross-built
      # bundles skip it (no metal to run them on) -- community tier.
      - uses: actions/setup-java@v5
        if: matrix.cross == ''
        with:
          # Azul Zulu (OpenJDK): one distribution that ships JDK 25 on every
          # platform including windows-arm64, which Temurin does not build yet.
          distribution: zulu
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6
        if: matrix.cross == ''

      - name: Install ffmpeg CLI (fixtures)
        if: matrix.cross == ''
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   sudo apt-get install -y ffmpeg ;;
            Windows) choco install -y ffmpeg ;;
            macOS)   brew install ffmpeg ;;
          esac

      - name: Test against the freshly built natives
        if: matrix.cross == ''
        shell: bash
        # Strict here catches a bundle that built but cannot load a
        # capability BEFORE it uploads -- the workflow that produced the
        # bundle is the right place to reject it. The required caps are this
        # tier's: a core bundle is never asked for the subs it does not
        # carry, and only full is asked for encode.
        env:
          SKINEMA_REQUIRE_CAPS: ${{ steps.tier.outputs.caps }}
        run: |
          base="$PWD"
          if [ "${{ runner.os }}" = "Windows" ]; then base="$(pwd -W)"; fi
          libdir="lib"
          if [ "${{ runner.os }}" = "Windows" ]; then libdir="bin"; fi
          SKINEMA_LIBAV_DIR="$base/natives/${{ matrix.platform }}/$libdir" ./gradlew :skinema-core:test --rerun-tasks

      # The flat loader-named bundle/ (built by the script) is the asset:
      # no symlinks, jar-ready layout, index.txt included. gzip, not xz --
      # Gradle's tarTree unpacks gz natively when assembling the jars.
      - name: Pack the bundle
        shell: bash
        run: tar -czf "skinema-natives-${{ matrix.tier }}-${{ matrix.platform }}.tar.gz" -C "natives/${{ matrix.platform }}/bundle" .

      - name: Upload to the rolling natives release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="natives-$FFMPEG_VERSION"
          # First job on a fresh tag creates the release; losers of that
          # race fall through to the upload.
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "Trimmed FFmpeg $FFMPEG_VERSION natives" \
              --notes "Per-platform trimmed FFmpeg runtimes in modular tiers (core/decode/full, see ROADMAP.md section 4). Assets are named skinema-natives-<tier>-<platform>.tar.gz and land independently as builds finish; a rebuild replaces its own asset." \
              || true
          gh release upload "$tag" "skinema-natives-${{ matrix.tier }}-${{ matrix.platform }}.tar.gz" --clobber

      - uses: actions/upload-artifact@v7
        with:
          name: skinema-natives-${{ matrix.tier }}-${{ matrix.platform }}
          path: natives/${{ matrix.platform }}
          if-no-files-found: error
