name: Natives

# Builds the trimmed shipping runtime (ROADMAP.md section 4) for every
# supported platform, runs the full decode suite against the fresh
# binaries, and uploads each platform INDEPENDENTLY to the rolling
# `natives-<ffmpeg version>` release: a queued or failed platform never
# blocks the others, late builds land hot on the same tag, and a rebuild
# simply replaces its own asset. Manual trigger: these are release
# artifacts, not per-commit noise.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FFMPEG_VERSION: "8.1.1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          # GitHub's free arm64 runners (public repos): a real machine,
          # so unlike the mac cross-build this platform gets the full
          # on-runner acceptance run.
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: windows-latest
            platform: windows-x64
          - os: macos-14
            platform: macos-arm64
          # GitHub's Intel mac runners are scarce-to-dead (day-to-month
          # queues), so x64 cross-compiles on the arm runner instead.
          # Community tier: no on-metal acceptance run -- an arm JVM
          # cannot load x86_64 dylibs.
          - os: macos-14
            platform: macos-x64
            cross: mac-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm meson ninja-build pkg-config

      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm meson ninja pkg-config

      - name: Install toolchain (Windows / MSYS2)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            curl
            unzip

      - name: Build trimmed FFmpeg (unix)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ matrix.cross }}" = "mac-x64" ]; then export MAC_CROSS_X64=1; fi
          STATIC_DEPS=1 FFMPEG_VERSION="$FFMPEG_VERSION" tools/build-natives.sh "$PWD/natives/${{ matrix.platform }}"

      - name: Build trimmed FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: STATIC_DEPS=1 FFMPEG_VERSION="$FFMPEG_VERSION" VPX_TARGET=x86_64-win64-gcc tools/build-natives.sh "$PWD/natives/${{ matrix.platform }}"

      # The acceptance gate: the suite must pass against the binaries we
      # are about to ship, on the platform that will run them. Cross-built
      # bundles skip it (no metal to run them on) -- community tier.
      - uses: actions/setup-java@v4
        if: matrix.cross == null
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        if: matrix.cross == null

      - name: Install ffmpeg CLI (fixtures)
        if: matrix.cross == null
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   sudo apt-get install -y ffmpeg ;;
            Windows) choco install -y ffmpeg ;;
            macOS)   brew install ffmpeg ;;
          esac

      - name: Test against the freshly built natives
        if: matrix.cross == null
        shell: bash
        env:
          SKINEMA_REQUIRE_DECODE: "1"
        run: |
          base="$PWD"
          if [ "${{ runner.os }}" = "Windows" ]; then base="$(pwd -W)"; fi
          libdir="lib"
          if [ "${{ runner.os }}" = "Windows" ]; then libdir="bin"; fi
          SKINEMA_LIBAV_DIR="$base/natives/${{ matrix.platform }}/$libdir" ./gradlew :skinema-core:test --rerun-tasks

      # The flat loader-named bundle/ (built by the script) is the asset:
      # no symlinks, jar-ready layout, index.txt included. gzip, not xz --
      # Gradle's tarTree unpacks gz natively when assembling the jars.
      - name: Pack the bundle
        shell: bash
        run: tar -czf "skinema-natives-${{ matrix.platform }}.tar.gz" -C "natives/${{ matrix.platform }}/bundle" .

      - name: Upload to the rolling natives release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="natives-$FFMPEG_VERSION"
          # First job on a fresh tag creates the release; losers of that
          # race fall through to the upload.
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "Trimmed FFmpeg $FFMPEG_VERSION natives" \
              --notes "Per-platform trimmed FFmpeg runtimes (see ROADMAP.md section 4). Assets land independently as platforms finish; a rebuild replaces its own asset." \
              || true
          gh release upload "$tag" "skinema-natives-${{ matrix.platform }}.tar.gz" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: skinema-natives-${{ matrix.platform }}
          path: natives/${{ matrix.platform }}
          if-no-files-found: error
