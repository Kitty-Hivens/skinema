name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every platform tests against OUR trimmed bundles from the
          # rolling natives release -- CI dogfoods exactly the bytes that
          # ship to users, loaded through the same SKINEMA_LIBAV_DIR
          # mechanism the classifier jars use. It pulls the full tier: the
          # superset bundle exercises decode, subtitles, webp, the extended
          # formats and encode in one run, so the suite runs whole (the
          # per-tier bundles are gated at build time in natives.yml itself).
          - os: ubuntu-latest
            platform: linux-x64
            caps: decode,subs,webp,encode,formats
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            caps: decode,subs,webp,encode,formats
          - os: windows-latest
            platform: windows-x64
            caps: decode,subs,webp,encode,formats
          - os: macos-14
            platform: macos-arm64
            caps: decode,subs,webp,encode,formats
    runs-on: ${{ matrix.os }}
    env:
      # The capabilities CI holds mandatory on this platform: a bundle
      # that cannot load one fails the build instead of silently skipping
      # the suites that need it -- a skip reads as green. See Fixtures and
      # CapabilitiesTest.
      SKINEMA_REQUIRE_CAPS: "${{ matrix.caps }}"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # Fixture generation needs a full-build CLI (libx264); the libraries
      # under test come from the natives release below. The GL/X11/font
      # set serves skiko's native in the :skinema-skiko tests -- the
      # arm64 runner image ships without it, unlike x64. System libass
      # exercises the subtitle suites until the bundles carry their own
      # (Windows has no system libass -- its subs coverage starts with
      # the rebuilt bundles).
      - name: Install ffmpeg CLI (fixtures), skiko's GL stack, libass
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   sudo apt-get update && sudo apt-get install -y ffmpeg libgl1 libegl1 libfontconfig1 libx11-6 libass9 libva2 ;;
            Windows) choco install -y ffmpeg ;;
            macOS)   brew install ffmpeg libass ;;
          esac

      # The tag comes from nativesVersion, the way the publish workflow reads
      # it: a literal here kept testing the previous bundle after a pin bump,
      # green the whole time. The rolling release also clobbers assets in
      # place, so the cache key must track the asset's upload time -- a fixed
      # suffix kept serving stale bundles after every natives re-dispatch.
      - name: Resolve the bundle tag and revision
        id: natives-rev
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nv=$(sed -n 's/^nativesVersion=//p' gradle.properties)
          tag="natives-${nv%%-*}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          rev=$(gh api "repos/${{ github.repository }}/releases/tags/$tag" \
            --jq '[.assets[] | select(.name == "skinema-natives-full-${{ matrix.platform }}.tar.gz")][0].updated_at' \
            2>/dev/null | tr -dc '0-9TZ:-' || true)
          echo "rev=${rev:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Cache the trimmed natives bundle
        id: libav-cache
        uses: actions/cache@v6
        with:
          path: libav-bundle
          key: skinema-${{ steps.natives-rev.outputs.tag }}-full-${{ matrix.platform }}-${{ steps.natives-rev.outputs.rev }}

      - name: Download the trimmed natives bundle
        if: steps.libav-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          TAG: ${{ steps.natives-rev.outputs.tag }}
        run: |
          mkdir -p libav-bundle
          curl -fsSL -o bundle.tar.gz \
            "https://github.com/${{ github.repository }}/releases/download/$TAG/skinema-natives-full-${{ matrix.platform }}.tar.gz"
          tar -xzf bundle.tar.gz -C libav-bundle

      - name: Point skinema at the bundle under test
        shell: bash
        run: |
          base="$PWD"
          if [ "${{ runner.os }}" = "Windows" ]; then base="$(pwd -W)"; fi
          echo "SKINEMA_LIBAV_DIR=$base/libav-bundle" >> "$GITHUB_ENV"

      - name: Build and test
        shell: bash
        run: |
          # Windows: make CI the clean machine. Drop the mingw/msys dirs
          # from PATH so the bundled DLLs' MinGW runtime imports (zlib1,
          # libwinpthread-1, libiconv-2, libbz2-1, liblzma-5) can resolve
          # ONLY from the bundle, never the toolchain -- a green run here is real
          # proof the Windows bundle is self-contained, not an artifact
          # of the runner happening to carry those DLLs. java is found via
          # JAVA_HOME, ffmpeg via choco, both outside the stripped dirs.
          if [ "${{ runner.os }}" = "Windows" ]; then
            export PATH="$(printf '%s' "$PATH" | tr ':' '\n' | grep -iEv 'mingw|msys' | paste -sd ':' -)"
          fi
          ./gradlew build
