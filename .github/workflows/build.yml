name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # The CLI only generates test fixtures; its version does not matter.
      # The libraries under test are NOT these -- see the pinned runtime below.
      - name: Install ffmpeg CLI (fixture generation)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # The pinned n8.1 runtime the bindings load (ROADMAP.md section 4).
      # BtbN's "latest" release rolls micro versions within the n8.1 line;
      # the cache key pins a snapshot until bumped deliberately.
      - name: Cache pinned FFmpeg n8.1 runtime
        id: libav-cache
        uses: actions/cache@v4
        with:
          path: ~/libav-n8.1
          key: btbn-ffmpeg-n8.1-linux64-lgpl-shared-v1

      - name: Download pinned FFmpeg n8.1 runtime
        if: steps.libav-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/libav-n8.1
          curl -fsSL -o /tmp/ffmpeg.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-lgpl-shared-8.1.tar.xz
          tar -xJf /tmp/ffmpeg.tar.xz -C ~/libav-n8.1 --strip-components=1

      - name: Build and test
        run: LD_LIBRARY_PATH="$HOME/libav-n8.1/lib" ./gradlew build
