name: Build

on:
  push:
    branches: [main]
  pull_request:
  # On demand, for a branch that has no pull request yet: the matrix is the
  # only thing that tests macOS and Windows, and waiting for a PR to find out
  # whether they build is the wrong order. The natives and publish workflows
  # already take this trigger.
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every platform tests against OUR trimmed bundles from the
          # rolling natives release -- CI dogfoods exactly the bytes that
          # ship to users, loaded through the same SKINEMA_LIBAV_DIR
          # mechanism the classifier jars use. It pulls the full tier: the
          # superset bundle exercises decode, subtitles, webp, the extended
          # formats and encode in one run, so the suite runs whole (the
          # per-tier bundles are gated at build time in natives.yml itself).
          # Every ceiling below is what a run measured plus one, and every one
          # of them was re-read from a run in which each row actually executed
          # the suite. That qualifier is not decoration: the ceiling used not to
          # be an input of the task it guards, so a row served from the build
          # cache returned green without the check ever running, and the numbers
          # here drifted away from what a run says. See the input declaration in
          # build.gradle.kts.
          #
          # Twenty-six on the Linux rows, glibc and musl alike, and it is the
          # same twenty-six tests on each. Twelve need a real output line: the
          # sink contract's ten cases against a live line, the line-position
          # race, and the mastered clock's pacing test. Thirteen need a GPU:
          # nine negotiation and fallback cases, three player paths that exist
          # only on the hardware decoder, and the VAAPI encode round trip. One
          # is the round trip for an encoder no bundle carries, the one that
          # refuses yuv420p, so the round trip skips while the rule it covers is
          # pinned by its own decision test, which runs here.
          #
          # No hosted runner has either device, and ALSA's dummy driver would
          # close the audio half but is not in these images: modprobe snd-dummy
          # answers "module not found" on both ubuntu runners. Those twelve are
          # measured on a developer machine and nowhere else, which is a real
          # gap in this matrix rather than a tolerance. The hardware gap is
          # narrower than it reads, because the format negotiation, which is
          # where hardware decode was actually broken, is checked here without a
          # device.
          #
          # Windows measures four over Linux. Two stage their failure by
          # deleting or replacing an open file, which it refuses: the audio
          # track switch and the webp reopen. One is the hardware encoder's
          # fail-closed case, which wants a device this platform has no VAAPI
          # for. One is the writer's index failure, which stages a full disk
          # through /dev/full.
          #
          # macOS measures six under Linux, and the direction is the point: the
          # nine hardware cases that need only a device to open RUN there, since
          # VideoToolbox opens on Apple Silicon (see that row's own note). Three
          # go the other way, the still-webp decode and the two Windows also
          # skips for want of VAAPI and /dev/full.
          #
          # The DVB tests used to be three skips per row waiting on a bundle
          # that did not carry the decoder. It does now, so 'dvbsub' is a
          # required capability above: absent, it fails the row loudly rather
          # than skipping quietly, which is what the required list is for. The
          # three run everywhere, the Alpine containers' own ffmpeg encodes
          # dvbsub too, which was the open question.
          #
          # 'encav1' and 'encopus' join the required list on the same argument
          # as dvbsub, and under names of their own rather than riding
          # 'encode': that one probes libx264, which is the GPL tier's tell,
          # while these two are BSD and ride decode as well.
          - os: ubuntu-latest
            platform: linux-x64
            tier: full
            caps: decode,subs,dvbsub,cea608,webp,encode,encav1,encopus,formats
            maxSkipped: 27
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            tier: full
            caps: decode,subs,dvbsub,cea608,webp,encode,encav1,encopus,formats
            maxSkipped: 27
          - os: windows-latest
            platform: windows-x64
            tier: full
            caps: decode,subs,dvbsub,cea608,webp,encode,encav1,encopus,formats
            maxSkipped: 31
          # windows-arm64 is here for the clean-PATH step below, which is the
          # only proof a bundle resolves its runtime imports from itself. The
          # natives workflow's own acceptance run cannot give it: that one
          # executes under MSYS2 with the toolchain prefix on PATH, so it
          # cannot tell a self-contained bundle from one leaning on the runner.
          - os: windows-11-arm
            platform: windows-arm64
            tier: full
            caps: decode,subs,dvbsub,cea608,webp,encode,encav1,encopus,formats
            maxSkipped: 31
          # Twenty measured, and every one of them named: twelve that need a
          # real output line, as everywhere else in this matrix; three
          # VAAPI-only decode paths and both hardware-encode cases, since a mac
          # has no VAAPI; the writer's index failure, which wants /dev/full; the
          # round trip for the encoder that refuses yuv420p; and the still-webp
          # decode. The font tests that used to sit here run now.
          #
          # It was thirty-one, and nine of the difference were tests that could
          # not build their fixture at all: Homebrew's ffmpeg carries neither
          # the libwebp nor the libaom-av1 encoder, so webp and AV1 decode --
          # shipped in every tier that carries them -- had never once been
          # exercised on this platform, invisible until this counter printed
          # it. They take a second route now (PNG frames through img2webp, y4m
          # through SvtAv1EncApp, both installed above), neither of which asks
          # the CLI for an encoder, and the ceiling comes down to what the run
          # actually skips. Tight on purpose: a route that quietly stops
          # working would put those nine back into the skip count, which is
          # exactly what this number is here to catch.
          # hwaccel on this row alone. Hosted macOS runners are Apple Silicon,
          # and the run says what the documentation does not: a VideoToolbox
          # device OPENS here (surface 157) and then every frame comes back in
          # software. So the GPU is not passed to the guest, and this row is
          # not GPU coverage -- but it is the only machine in the matrix that
          # exercises a device open, the format negotiation and the fallback
          # on a second backend, which is worth more than skipping the lot.
          # SKINEMA_REQUIRE_HWACCEL is deliberately NOT set: that one says the
          # machine decodes on the GPU, and this one does not.
          - os: macos-14
            platform: macos-arm64
            tier: full
            caps: decode,subs,dvbsub,cea608,webp,encode,encav1,encopus,formats
            hwaccel: "1"
            maxSkipped: 21
          # The musl bundles are published like every other platform and were
          # the only ones no test here ever loaded. They run inside Alpine,
          # because the question is whether a musl JVM can load them -- a
          # glibc runner cannot answer it. Scoped to :skinema-core:test rather
          # than the whole build for the same reason the natives workflow is:
          # skiko ships no musl native, so :skinema-skiko cannot run there.
          - os: ubuntu-latest
            platform: linux-musl-x64
            tier: full
            libc: musl
            caps: decode,subs,dvbsub,cea608,webp,encode,encav1,encopus,formats
            maxSkipped: 27
          - os: ubuntu-24.04-arm
            platform: linux-musl-arm64
            tier: full
            libc: musl
            caps: decode,subs,dvbsub,cea608,webp,encode,encav1,encopus,formats
            maxSkipped: 27
          # The tier the consumer actually ships, run through the same suite.
          # Every other row here takes `full`, which nobody deploys: the
          # launcher takes `decode`, and until this row existed that tier saw
          # only its own acceptance run inside natives.yml -- one pass, on the
          # runner that built it, under a ceiling deliberately loose enough to
          # cover the leanest tier. So the bundle that reaches people had less
          # scrutiny than the one that does not.
          #
          # linux-x64 rather than all eight: what differs between the tiers is
          # which components are compiled in, and that is identical across
          # platforms. What differs BETWEEN platforms -- loading, the import
          # closure, the symbol floors -- is asserted per platform and per tier
          # by the natives build itself, before anything uploads.
          #
          # No 'encode' capability: that probes libx264, which is exactly what
          # this tier does not carry. The AV1 and Opus encoders are still
          # required, because this is the tier M18 taught to write.
          #
          # Forty-three measured, declared at forty-four. Seventeen over the
          # full row on the same machine, and all seventeen write through
          # libx264: nine writer cases, seven transcoder cases and the
          # non-ascii path write. That gap IS the tier difference, so a number
          # that stops matching it means a test started depending on the GPL
          # encoders without saying so.
          - os: ubuntu-latest
            platform: linux-x64
            tier: decode
            caps: decode,subs,dvbsub,cea608,webp,encav1,encopus,formats
            maxSkipped: 44
          # macos-x64 is shipped but NOT tested anywhere: it cross-builds on an
          # arm mac and no hosted Intel runner remains to load the result. It
          # stays community-tier until one does; treat the platform table as
          # saying seven tested of eight.
    runs-on: ${{ matrix.os }}
    # Rows finish in three to six minutes. The ceiling is here because a
    # hosted runner's apt-get has hung on the ffmpeg install twice, and the
    # default six-hour limit turns that into a job that reads as "still
    # running" for the rest of the day rather than a failure anyone can see.
    timeout-minutes: 30
    env:
      # The capabilities CI holds mandatory on this platform: a bundle
      # that cannot load one fails the build instead of silently skipping
      # the suites that need it -- a skip reads as green. See Fixtures and
      # CapabilitiesTest.
      SKINEMA_REQUIRE_CAPS: "${{ matrix.caps }}"
      # How many tests may skip before the build calls it a collapse rather
      # than a run. Platforms with a wider legitimate gap raise it in the
      # matrix and say why there.
      SKINEMA_MAX_SKIPPED: "${{ matrix.maxSkipped || 8 }}"
      # Empty everywhere but the row that opted in above.
      SKINEMA_TEST_HWACCEL: "${{ matrix.hwaccel }}"
    steps:
      - uses: actions/checkout@v7

      # The musl jobs get their JDK and their tools from apk inside the
      # container instead: a zulu build for glibc cannot run there at all.
      - uses: actions/setup-java@v6
        if: matrix.libc != 'musl'
        with:
          distribution: zulu
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6
        if: matrix.libc != 'musl'

      # Fixture generation needs a full-build CLI (libx264); the libraries
      # under test come from the natives release below. The GL/X11/font
      # set serves skiko's native in the :skinema-skiko tests -- the
      # arm64 runner image ships without it, unlike x64. System libass
      # exercises the subtitle suites until the bundles carry their own
      # (Windows has no system libass -- its subs coverage starts with
      # the rebuilt bundles).
      - name: Install ffmpeg CLI (fixtures), skiko's GL stack, libass
        if: matrix.libc != 'musl'
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)
              # Every wait here is bounded, because none of them were and the
              # x64 runner hung on this step three dispatches running: the
              # image's unattended-upgrade holds the dpkg lock, and apt waits
              # for it forever by default. The lock timeout turns that into a
              # wait that ends, and the retries cover a mirror that stalls.
              sudo apt-get -o DPkg::Lock::Timeout=300 -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=30 update
              sudo apt-get -o DPkg::Lock::Timeout=300 -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=30 install -y \
                ffmpeg libgl1 libegl1 libfontconfig1 libx11-6 libass9 libva2
              ;;
            Windows) choco install -y ffmpeg ;;
            # webp and svt-av1 are the fixture builders' second route: this
            # runner's ffmpeg carries neither libwebp nor libaom, so the
            # animated-WebP and AV1 suites had no fixture to build and skipped
            # -- decoders that ship in every tier, never exercised here.
            macOS)   brew install ffmpeg libass webp svt-av1 ;;
          esac

      # The tag comes from nativesVersion, the way the publish workflow reads
      # it: a literal here kept testing the previous bundle after a pin bump,
      # green the whole time. The rolling release also clobbers assets in
      # place, so the cache key must track the asset's upload time -- a fixed
      # suffix kept serving stale bundles after every natives re-dispatch.
      - name: Resolve the bundle tag and revision
        id: natives-rev
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nv=$(sed -n 's/^nativesVersion=//p' gradle.properties)
          tag="natives-${nv%%-*}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          rev=$(gh api "repos/${{ github.repository }}/releases/tags/$tag" \
            --jq '[.assets[] | select(.name == "skinema-natives-${{ matrix.tier }}-${{ matrix.platform }}.tar.gz")][0].updated_at' \
            2>/dev/null | tr -dc '0-9TZ:-' || true)
          # A constant fallback would be a STABLE key, so one lookup failure
          # would pin a stale bundle in the cache and serve it to every later
          # run. Falling back to the run id makes the key unique instead: the
          # cache misses, the bundle downloads fresh, and nothing is poisoned.
          echo "rev=${rev:-run-${{ github.run_id }}}" >> "$GITHUB_OUTPUT"

      - name: Cache the trimmed natives bundle
        id: libav-cache
        uses: actions/cache@v6
        with:
          path: libav-bundle
          key: skinema-${{ steps.natives-rev.outputs.tag }}-${{ matrix.tier }}-${{ matrix.platform }}-${{ steps.natives-rev.outputs.rev }}

      - name: Download the trimmed natives bundle
        if: steps.libav-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          TAG: ${{ steps.natives-rev.outputs.tag }}
        run: |
          mkdir -p libav-bundle
          curl -fsSL -o bundle.tar.gz \
            "https://github.com/${{ github.repository }}/releases/download/$TAG/skinema-natives-${{ matrix.tier }}-${{ matrix.platform }}.tar.gz"
          tar -xzf bundle.tar.gz -C libav-bundle

      # Once per matrix, not seven times: the claims are about the format set,
      # which is the same everywhere the full tier is built.
      #
      # Both tables, because there are two. The guide's copy went unchecked
      # and drifted a whole tier behind the one in the README.
      # The full tier specifically, not merely linux-x64. Both claims files are
      # written against full as the superset -- it is the only build carrying
      # both the GPL software encoders and the VAAPI ones -- so running them
      # against a leaner tier reports its missing components as broken claims.
      # Which is exactly what the decode row did on its first run: correct
      # check, wrong gate, and the row earned its keep by finding it.
      - name: Check the format claims against the bundle
        if: matrix.platform == 'linux-x64' && matrix.tier == 'full'
        shell: bash
        run: |
          bash tools/check-readme-formats.sh libav-bundle/manifest.txt
          bash tools/check-readme-formats.sh libav-bundle/manifest.txt docs/guide/formats-and-behavior.md
          # And the write side, which had no such join at all until the encode
          # surface grew past one codec. Its own claims file and its own floor:
          # thirteen claims, not sixty.
          bash tools/check-readme-formats.sh libav-bundle/manifest.txt README.md docs/encode-claims.txt "What it writes" 13

      - name: Point skinema at the bundle under test
        if: matrix.libc != 'musl'
        shell: bash
        run: |
          base="$PWD"
          if [ "${{ runner.os }}" = "Windows" ]; then base="$(pwd -W)"; fi
          echo "SKINEMA_LIBAV_DIR=$base/libav-bundle" >> "$GITHUB_ENV"

      # libva and fontconfig are the host libraries the full musl bundle links
      # eagerly (tools/bundle-surface.txt names them), font-dejavu because the
      # image carries no typeface and libass renders nothing without one, and
      # ffmpeg is the CLI the fixtures shell out to.
      - name: Build and test (musl, in Alpine)
        if: matrix.libc == 'musl'
        shell: bash
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e SKINEMA_REQUIRE_CAPS -e SKINEMA_MAX_SKIPPED \
            alpine:edge sh -euc '
              apk add --no-cache bash openjdk25 ffmpeg font-dejavu fontconfig libva libstdc++ >/dev/null
              export JAVA_HOME=/usr/lib/jvm/java-25-openjdk
              export SKINEMA_LIBAV_DIR=/src/libav-bundle
              ./gradlew :skinema-core:test
            '

      - name: Build and test
        if: matrix.libc != 'musl'
        shell: bash
        run: |
          # Windows: make CI the clean machine. Drop the mingw/msys dirs
          # from PATH so the bundled DLLs' MinGW runtime imports (zlib1,
          # libwinpthread-1, libiconv-2, libbz2-1, liblzma-5) can resolve
          # ONLY from the bundle, never the toolchain -- a green run here is real
          # proof the Windows bundle is self-contained, not an artifact
          # of the runner happening to carry those DLLs. java is found via
          # JAVA_HOME, ffmpeg via choco, both outside the stripped dirs.
          if [ "${{ runner.os }}" = "Windows" ]; then
            export PATH="$(printf '%s' "$PATH" | tr ':' '\n' | grep -iEv 'mingw|msys' | paste -sd ':' -)"
          fi
          ./gradlew build

      # The XML the counter reads, kept for the runs where the count itself
      # raises a question -- which suites skipped, and why. Uploaded even on
      # failure, since that is when it is worth having.
      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # The tier belongs in the name now that two rows share a platform:
          # both linux-x64 jobs uploaded under one name, and while the upload
          # allows it, the pair is then impossible to tell apart.
          name: test-results-${{ matrix.platform }}-${{ matrix.tier }}
          path: "**/build/test-results/test/*.xml"
          if-no-files-found: warn
          retention-days: 14
