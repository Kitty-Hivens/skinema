name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every platform tests against OUR trimmed bundles from the
          # rolling natives release -- CI dogfoods exactly the bytes that
          # ship to users, loaded through the same SKINEMA_LIBAV_DIR
          # mechanism the classifier jars use.
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: windows-latest
            platform: windows-x64
          - os: macos-14
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    env:
      # The capabilities CI holds mandatory: a bundle that cannot load
      # any of these fails the build instead of silently skipping the
      # suites that need it -- a skip reads as green. See Fixtures and
      # CapabilitiesTest.
      SKINEMA_REQUIRE_CAPS: "decode,subs,webp"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # Fixture generation needs a full-build CLI (libx264); the libraries
      # under test come from the natives release below. The GL/X11/font
      # set serves skiko's native in the :skinema-skiko tests -- the
      # arm64 runner image ships without it, unlike x64. System libass
      # exercises the subtitle suites until the bundles carry their own
      # (Windows has no system libass -- its subs coverage starts with
      # the rebuilt bundles).
      - name: Install ffmpeg CLI (fixtures), skiko's GL stack, libass
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   sudo apt-get update && sudo apt-get install -y ffmpeg libgl1 libegl1 libfontconfig1 libx11-6 libass9 ;;
            Windows) choco install -y ffmpeg ;;
            macOS)   brew install ffmpeg libass ;;
          esac

      # The rolling release clobbers assets in place, so the cache key must
      # track the asset's upload time -- a fixed suffix kept serving stale
      # bundles after every natives re-dispatch.
      - name: Resolve the bundle revision
        id: natives-rev
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rev=$(gh api repos/${{ github.repository }}/releases/tags/natives-8.1.1 \
            --jq '[.assets[] | select(.name == "skinema-natives-${{ matrix.platform }}.tar.gz")][0].updated_at' \
            2>/dev/null | tr -dc '0-9TZ:-' || true)
          echo "rev=${rev:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Cache the trimmed natives bundle
        id: libav-cache
        uses: actions/cache@v4
        with:
          path: libav-bundle
          key: skinema-natives-8.1.1-${{ matrix.platform }}-${{ steps.natives-rev.outputs.rev }}

      - name: Download the trimmed natives bundle
        if: steps.libav-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p libav-bundle
          curl -fsSL -o bundle.tar.gz \
            "https://github.com/Kitty-Hivens/skinema/releases/download/natives-8.1.1/skinema-natives-${{ matrix.platform }}.tar.gz"
          tar -xzf bundle.tar.gz -C libav-bundle

      - name: Point skinema at the bundle under test
        shell: bash
        run: |
          base="$PWD"
          if [ "${{ runner.os }}" = "Windows" ]; then base="$(pwd -W)"; fi
          echo "SKINEMA_LIBAV_DIR=$base/libav-bundle" >> "$GITHUB_ENV"

      - name: Build and test
        shell: bash
        run: ./gradlew build
