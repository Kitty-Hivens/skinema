name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux and Windows test against the pinned BtbN n8.1 runtime --
          # the same line the trimmed shipping builds follow. macOS has no
          # BtbN; until our own trimmed mac builds land (M3), it tests
          # against Homebrew's ffmpeg, and the strict version probe fails
          # the job loudly if brew drifts off major 8.
          - os: ubuntu-latest
            libav: btbn
            asset: ffmpeg-n8.1-latest-linux64-lgpl-shared-8.1.tar.xz
            libdir: lib
          - os: windows-latest
            libav: btbn
            asset: ffmpeg-n8.1-latest-win64-lgpl-shared-8.1.zip
            libdir: bin
          - os: macos-14
            libav: brew
    runs-on: ${{ matrix.os }}
    env:
      # A runner with a broken decode environment must fail, not skip.
      SKINEMA_REQUIRE_DECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # Fixture generation needs a full-build CLI (libx264); the libraries
      # under test are pointed at separately below.
      - name: Install ffmpeg CLI (fixtures)
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   sudo apt-get update && sudo apt-get install -y ffmpeg ;;
            Windows) choco install -y ffmpeg ;;
            macOS)   brew install ffmpeg ;;
          esac

      - name: Cache pinned FFmpeg n8.1 runtime
        if: matrix.libav == 'btbn'
        id: libav-cache
        uses: actions/cache@v4
        with:
          path: libav-n8.1
          key: btbn-${{ matrix.asset }}-v1

      - name: Download pinned FFmpeg n8.1 runtime
        if: matrix.libav == 'btbn' && steps.libav-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p libav-n8.1
          curl -fsSL -o pkg "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/${{ matrix.asset }}"
          case "${{ matrix.asset }}" in
            *.tar.xz) tar -xJf pkg -C libav-n8.1 --strip-components=1 ;;
            *.zip)    unzip -q pkg -d tmp-zip && mv tmp-zip/*/* libav-n8.1/ ;;
          esac

      - name: Point skinema at the runtime under test
        shell: bash
        run: |
          if [ "${{ matrix.libav }}" = "brew" ]; then
            echo "SKINEMA_LIBAV_DIR=$(brew --prefix ffmpeg)/lib" >> "$GITHUB_ENV"
          else
            base="$PWD"
            if [ "${{ runner.os }}" = "Windows" ]; then base="$(pwd -W)"; fi
            echo "SKINEMA_LIBAV_DIR=$base/libav-n8.1/${{ matrix.libdir }}" >> "$GITHUB_ENV"
          fi

      - name: Build and test
        shell: bash
        run: ./gradlew build
